/* ============================================================
   SECTION 2: PERSISTENCE
   ============================================================ */
function defaultSave(){
  return {
    coins: 0,
    unlockedLevels: [1],
    completedLevels: [],
    ownedSkins: ['default'],
    selectedSkin: 'default',
    settings: { music: true, sfx: true }
  };
}

let save = defaultSave();

function loadSave(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw){
      const obj = JSON.parse(raw);
      const def = defaultSave();
      save = {
        coins: typeof obj.coins === 'number' ? obj.coins : def.coins,
        unlockedLevels: Array.isArray(obj.unlockedLevels) && obj.unlockedLevels.length ? obj.unlockedLevels.slice() : def.unlockedLevels,
        completedLevels: Array.isArray(obj.completedLevels) ? obj.completedLevels.slice() : def.completedLevels,
        ownedSkins: Array.isArray(obj.ownedSkins) && obj.ownedSkins.length ? obj.ownedSkins.slice() : def.ownedSkins,
        selectedSkin: typeof obj.selectedSkin === 'string' ? obj.selectedSkin : def.selectedSkin,
        settings: {
          music: obj.settings && typeof obj.settings.music === 'boolean' ? obj.settings.music : def.settings.music,
          sfx:   obj.settings && typeof obj.settings.sfx   === 'boolean' ? obj.settings.sfx   : def.settings.sfx
        }
      };
      if(save.unlockedLevels.indexOf(1) < 0) save.unlockedLevels.push(1);
      if(save.ownedSkins.indexOf('default') < 0) save.ownedSkins.push('default');
      if(!SKINS.some(s=>s.id===save.selectedSkin)) save.selectedSkin = 'default';
    }
  } catch(e){
    save = defaultSave();
  }
}

function persist(){
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }
  catch(e){ /* storage may be unavailable; ignore */ }
}

function unlockLevel(n){
  if(n >= 1 && n <= LEVELS.length && save.unlockedLevels.indexOf(n) < 0){
    save.unlockedLevels.push(n);
  }
}
function completeLevel(n){
  if(save.completedLevels.indexOf(n) < 0) save.completedLevels.push(n);
  unlockLevel(n + 1);
}

/* ============================================================
   SECTION 4: AUDIO SYSTEM
   ============================================================ */
const Audio2 = (function(){
  let actx = null;
  let masterGain = null;
  let musicGain = null;
  let started = false;
  let musicTimer = null;
  let step = 0;

  // Pentatonic-flavoured scale frequencies
  const BASS = [110.00, 123.47, 146.83, 110.00, 98.00, 110.00, 146.83, 130.81];
  const MELODY = [
    440.00, 523.25, 587.33, 659.25,
    587.33, 523.25, 440.00, 392.00,
    440.00, 587.33, 659.25, 783.99,
    659.25, 587.33, 523.25, 440.00
  ];

  function ensure(){
    if(actx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      actx = new AC();
      masterGain = actx.createGain();
      masterGain.gain.value = 0.5;
      masterGain.connect(actx.destination);
      musicGain = actx.createGain();
      musicGain.gain.value = save.settings.music ? 0.35 : 0.0;
      musicGain.connect(masterGain);
    } catch(e){ actx = null; }
  }

  // Called on first user gesture
  function init(){
    ensure();
    if(actx && actx.state === 'suspended'){ actx.resume(); }
    started = true;
  }

  function playMusic(){
    ensure();
    if(!actx) return;
    if(musicTimer) return;
    step = 0;
    const tick = function(){
      if(!actx) return;
      const now = actx.currentTime;
      tone(BASS[step % BASS.length], 'triangle', now, 0.32, 0.18, musicGain);
      if(step % 2 === 0){
        tone(MELODY[step % MELODY.length], 'sine', now, 0.26, 0.10, musicGain);
      }
      if(step % 8 === 4){
        tone(MELODY[(step+4) % MELODY.length]*2, 'sine', now, 0.18, 0.05, musicGain);
      }
      step++;
    };
    tick();
    musicTimer = setInterval(tick, 340);
  }
  function stopMusic(){
    if(musicTimer){ clearInterval(musicTimer); musicTimer = null; }
  }

  function tone(freq, type, when, dur, vol, dest){
    if(!actx) return;
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(vol, when + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    o.connect(g);
    g.connect(dest || masterGain);
    o.start(when);
    o.stop(when + dur + 0.05);
  }

  function sfx(name){
    ensure();
    if(!actx || !save.settings.sfx) return;
    const now = actx.currentTime;
    if(name === 'crash'){
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(220, now);
      o.frequency.exponentialRampToValueAtTime(50, now + 0.4);
      g.gain.setValueAtTime(0.4, now);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.45);
      o.connect(g); g.connect(masterGain);
      o.start(now); o.stop(now + 0.5);
      tone(110, 'square', now, 0.25, 0.2, masterGain);
    } else if(name === 'hit'){
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = 'square';
      o.frequency.setValueAtTime(330, now);
      o.frequency.exponentialRampToValueAtTime(80, now + 0.3);
      g.gain.setValueAtTime(0.35, now);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.32);
      o.connect(g); g.connect(masterGain);
      o.start(now); o.stop(now + 0.35);
    } else if(name === 'coin'){
      tone(880, 'sine', now, 0.08, 0.3, masterGain);
      tone(1320, 'sine', now + 0.07, 0.09, 0.28, masterGain);
    } else if(name === 'fanfare'){
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((f,i)=> tone(f, 'triangle', now + i*0.13, 0.3, 0.3, masterGain));
      tone(1046.5, 'sine', now + 0.55, 0.5, 0.25, masterGain);
    } else if(name === 'click'){
      tone(660, 'square', now, 0.05, 0.18, masterGain);
    }
  }

  function setMusicEnabled(on){
    ensure();
    if(musicGain && actx){
      const now = actx.currentTime;
      musicGain.gain.cancelScheduledValues(now);
      musicGain.gain.setValueAtTime(musicGain.gain.value, now);
      musicGain.gain.linearRampToValueAtTime(on ? 0.35 : 0.0, now + 0.2);
    } else if(musicGain){
      musicGain.gain.value = on ? 0.35 : 0.0;
    }
    if(on){ playMusic(); }
  }

  return { init, playMusic, stopMusic, sfx, setMusicEnabled,
           isStarted: ()=>started };
})();

/* ============================================================
   SECTION 5: INPUT HANDLING
   ============================================================ */
const keys = {};
let pointerDown = false;
let pointerTarget = { x: CANVAS_W/2, y: CANVAS_H - 120 };
let usePointerSteer = false;

function canvasCoords(evt){
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  let cx, cy;
  if(evt.touches && evt.touches.length){
    cx = evt.touches[0].clientX; cy = evt.touches[0].clientY;
  } else {
    cx = evt.clientX; cy = evt.clientY;
  }
  return { x: (cx - rect.left) * scaleX, y: (cy - rect.top) * scaleY };
}

document.addEventListener('keydown', function(e){
  firstGesture();
  keys[e.key] = true;
  keys[e.code] = true;
  if([' ','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].indexOf(e.key) >= 0){
    e.preventDefault();
  }
  if(e.key === ' ' || e.code === 'Space'){
    handleSpace();
  }
  usePointerSteer = false;
});
document.addEventListener('keyup', function(e){
  keys[e.key] = false;
  keys[e.code] = false;
});

canvas.addEventListener('mousemove', function(e){
  const p = canvasCoords(e);
  mouseX = p.x; mouseY = p.y;
  if(pointerDown && state === S.PLAYING){
    pointerTarget.x = p.x; pointerTarget.y = p.y;
    usePointerSteer = true;
  }
});
canvas.addEventListener('mousedown', function(e){
  firstGesture();
  const p = canvasCoords(e);
  mouseX = p.x; mouseY = p.y;
  pointerDown = true;
  if(state === S.PLAYING){
    pointerTarget.x = p.x; pointerTarget.y = p.y;
    usePointerSteer = true;
  }
  handleClick(p.x, p.y);
});
canvas.addEventListener('mouseup', function(){ pointerDown = false; });
canvas.addEventListener('mouseleave', function(){ pointerDown = false; });

canvas.addEventListener('touchstart', function(e){
  firstGesture();
  e.preventDefault();
  const p = canvasCoords(e);
  pointerDown = true;
  if(state === S.PLAYING){
    pointerTarget.x = p.x; pointerTarget.y = p.y;
    usePointerSteer = true;
  }
  handleClick(p.x, p.y);
}, { passive:false });
canvas.addEventListener('touchmove', function(e){
  e.preventDefault();
  const p = canvasCoords(e);
  if(pointerDown && state === S.PLAYING){
    pointerTarget.x = p.x; pointerTarget.y = p.y;
    usePointerSteer = true;
  }
}, { passive:false });
canvas.addEventListener('touchend', function(e){
  e.preventDefault();
  pointerDown = false;
}, { passive:false });

let gestureDone = false;
function firstGesture(){
  if(gestureDone) return;
  gestureDone = true;
  Audio2.init();
  if(save.settings.music) Audio2.setMusicEnabled(true);
}

function handleSpace(){
  if(state === S.TRANSITION){
    startLevelPlay();
  } else if(state === S.GAME_OVER){
    beginLevel(curLevelIndex);
  } else if(state === S.LEVEL_COMPLETE){
    advanceFromComplete();
  } else if(state === S.WIN){
    gotoMenu();
  } else if(state === S.MENU){
    gotoLevelSelect();
  }
}

/* ============================================================
   SECTION 6: BUTTON SYSTEM (draw + click detection)
   ============================================================ */
let buttons = [];

function resetButtons(){ buttons = []; }

function addButton(x, y, w, h, label, onClick, opts){
  opts = opts || {};
  const b = {
    x:x, y:y, w:w, h:h, label:label, onClick:onClick,
    enabled: opts.enabled !== false,
    fill: opts.fill || '#1f78c4',
    fillDisabled: opts.fillDisabled || '#3a4654',
    text: opts.text || '#ffffff',
    font: opts.font || 'bold 20px "Trebuchet MS", sans-serif',
    radius: opts.radius != null ? opts.radius : 10,
    invisible: !!opts.invisible
  };
  buttons.push(b);
  return b;
}

function drawSingleButton(b){
  if(b.invisible) return;
  const hover = mouseX>=b.x && mouseX<=b.x+b.w && mouseY>=b.y && mouseY<=b.y+b.h;
  ctx.save();
  roundRect(b.x, b.y, b.w, b.h, b.radius);
  let fill = b.enabled ? b.fill : b.fillDisabled;
  if(b.enabled && hover) fill = lighten(fill, 22);
  ctx.fillStyle = fill; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.stroke();
  ctx.fillStyle = b.enabled ? b.text : 'rgba(255,255,255,0.4)';
  ctx.font = b.font; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(b.label, b.x+b.w/2, b.y+b.h/2+1);
  ctx.restore();
}

function drawButtons(){
  for(const b of buttons) drawSingleButton(b);
}

function buttonsClick(x, y){
  // iterate in reverse so topmost buttons win
  for(let i = buttons.length - 1; i >= 0; i--){
    const b = buttons[i];
    if(!b.enabled) continue;
    if(x>=b.x && x<=b.x+b.w && y>=b.y && y<=b.y+b.h){
      Audio2.sfx('click');
      b.onClick();
      return true;
    }
  }
  return false;
}

// Drawing helpers
function roundRect(x, y, w, h, r){
  if(r > Math.min(w,h)/2) r = Math.min(w,h)/2;
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}
function lighten(hexOrRgb, amt){
  if(hexOrRgb[0] !== '#') return hexOrRgb;
  let h = hexOrRgb.slice(1);
  if(h.length === 3) h = h.split('').map(c=>c+c).join('');
  let r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
  r = Math.min(255, r+amt); g = Math.min(255, g+amt); b = Math.min(255, b+amt);
  return 'rgb('+r+','+g+','+b+')';
}

/* ============================================================
   SECTION 7: PLAYER
   ============================================================ */
function makePlayer(){
  return {
    x: CANVAS_W/2,
    y: PLAY_TOP + PLAY_H - 100,
    w: 26, h: 42,
    speed: 4.4,
    bob: 0
  };
}

function updatePlayer(){
  const p = player;
  let dx = 0, dy = 0;

  if(usePointerSteer){
    const tx = pointerTarget.x, ty = pointerTarget.y;
    const ddx = tx - p.x, ddy = ty - p.y;
    const dist = Math.hypot(ddx, ddy);
    if(dist > 2){
      const sp = Math.min(p.speed, dist);
      dx = (ddx/dist) * sp;
      dy = (ddy/dist) * sp;
    }
  } else {
    if(keys['ArrowLeft'] || keys['a'] || keys['A']) dx -= p.speed;
    if(keys['ArrowRight']|| keys['d'] || keys['D']) dx += p.speed;
    if(keys['ArrowUp']   || keys['w'] || keys['W']) dy -= p.speed;
    if(keys['ArrowDown'] || keys['s'] || keys['S']) dy += p.speed;
  }

  // wind drift (rightward)
  if(level && level.wind){
    p.x += level.wind * 1.0;
  }

  p.x += dx;
  p.y += dy;
  p.bob += 0.15;

  const margin = p.w/2;
  if(p.x < margin) p.x = margin;
  if(p.x > CANVAS_W - margin) p.x = CANVAS_W - margin;
  if(p.y < PLAY_TOP + p.h/2) p.y = PLAY_TOP + p.h/2;
  if(p.y > PLAY_TOP + PLAY_H - p.h/2) p.y = PLAY_TOP + PLAY_H - p.h/2;
}

function drawBoat(x, y, scale, hull, sail, mastColor, flip, bob){
  ctx.save();
  ctx.translate(x, y + (bob ? Math.sin(bob)*2 : 0));
  ctx.scale(scale, scale * (flip ? -1 : 1));

  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.beginPath();
  ctx.ellipse(0, 20, 17, 7, 0, 0, Math.PI*2);
  ctx.fill();

  // hull (pointed bow up)
  ctx.fillStyle = hull;
  ctx.beginPath();
  ctx.moveTo(0, -22);
  ctx.quadraticCurveTo(14, -4, 12, 14);
  ctx.lineTo(-12, 14);
  ctx.quadraticCurveTo(-14, -4, 0, -22);
  ctx.closePath();
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(0,0,0,0.25)';
  ctx.stroke();
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.fillRect(-11, 10, 22, 4);

  // mast
  ctx.strokeStyle = mastColor || '#5a3a18';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, 12);
  ctx.lineTo(0, -16);
  ctx.stroke();

  // sail
  ctx.fillStyle = sail;
  ctx.beginPath();
  ctx.moveTo(1, -14);
  ctx.quadraticCurveTo(13, -2, 1, 8);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.12)';
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.restore();
}

function drawPlayer(){
  const skin = SKINS.find(s=>s.id === save.selectedSkin) || SKINS[0];
  let alpha = 1;
  if(invincible > 0 && Math.floor(frame/4) % 2 === 0) alpha = 0.4;
  ctx.save();
  ctx.globalAlpha = alpha;
  drawBoat(player.x, player.y, 1.0, skin.hull, skin.sail, '#5a3a18', false, player.bob);
  ctx.restore();
}

/* ============================================================
   SECTION 8: PIRATES (spawn, update, draw)
   ============================================================ */
function spawnPirates(n){
  for(let i=0;i<n;i++){
    const pat = level.patterns[(Math.random()*level.patterns.length)|0];
    const x = 30 + Math.random()*(CANVAS_W - 60);
    const baseSpeed = level.pirateSpeed;
    const p = {
      x: x,
      baseX: x,
      y: PLAY_TOP - 30 - Math.random()*40,
      w: 28, h: 44,
      pattern: pat,
      vy: baseSpeed,
      vx: 0,
      zigDir: Math.random() < 0.5 ? -1 : 1,
      zigPeriod: 50 + (Math.random()*30|0),
      zigTimer: 0,
      spiralPhase: Math.random()*Math.PI*2,
      spiralAmp: 50 + Math.random()*40,
      fireTimer: (Math.random()*30)|0,
      bob: Math.random()*Math.PI*2,
      visible: true,
      ghostTimer: (Math.random()*90)|0
    };
    if(pat === 'diagonal'){
      const ang = (Math.random()<0.5? -1:1) * (0.4 + Math.random()*0.4);
      p.vx = Math.sin(ang) * baseSpeed;
    }
    // clamp spiral base so it stays on screen
    p.baseX = Math.max(p.spiralAmp + 16, Math.min(CANVAS_W - p.spiralAmp - 16, p.baseX));
    pirates.push(p);
  }
}

function updatePirates(){
  const sp = level.pirateSpeed * timeScale;
  for(let i = pirates.length - 1; i >= 0; i--){
    const p = pirates[i];
    p.bob += 0.12;

    switch(p.pattern){
      case 'straight':
        p.y += sp;
        break;
      case 'diagonal': {
        const dirSign = p.vx >= 0 ? 1 : -1;
        const mag = Math.abs(p.vx) * timeScale;
        p.x += dirSign * mag;
        p.y += sp;
        if(p.x < p.w/2){ p.x = p.w/2; p.vx = Math.abs(p.vx); }
        if(p.x > CANVAS_W - p.w/2){ p.x = CANVAS_W - p.w/2; p.vx = -Math.abs(p.vx); }
        break;
      }
      case 'zigzag':
        p.zigTimer++;
        if(p.zigTimer >= p.zigPeriod){ p.zigDir *= -1; p.zigTimer = 0; }
        p.x += p.zigDir * 1.8 * timeScale;
        p.y += sp;
        if(p.x < p.w/2){ p.x = p.w/2; p.zigDir = 1; }
        if(p.x > CANVAS_W - p.w/2){ p.x = CANVAS_W - p.w/2; p.zigDir = -1; }
        break;
      case 'homing': {
        if(player){
          const diff = player.x - p.x;
          p.x += Math.sign(diff) * Math.min(Math.abs(diff), 1.3 * timeScale);
        }
        p.y += sp * 0.95;
        break;
      }
      case 'spiral':
        p.spiralPhase += 0.06 * timeScale;
        p.x = p.baseX + Math.sin(p.spiralPhase) * p.spiralAmp;
        p.y += sp * 0.9;
        if(p.x < p.w/2) p.x = p.w/2;
        if(p.x > CANVAS_W - p.w/2) p.x = CANVAS_W - p.w/2;
        break;
    }

    // ghost visibility toggling
    if(level.ghost){
      p.ghostTimer++;
      if(p.ghostTimer >= 90){ p.ghostTimer = 0; p.visible = !p.visible; }
    } else {
      p.visible = true;
    }

    // firing
    if(level.fireRate > 0){
      p.fireTimer++;
      const effRate = Math.max(24, level.fireRate / timeScale);
      if(p.fireTimer >= effRate && p.y > PLAY_TOP && p.y < PLAY_TOP + PLAY_H - 40){
        p.fireTimer = 0;
        fireCannon(p);
      }
    }

    // collision with player (collide even when ghost-invisible to keep it fair-ish:
    // only collide when visible so invisible pirates can't sneak-kill)
    if(player && invincible <= 0 && state === S.PLAYING && p.visible){
      if(rectOverlap(p.x - p.w*0.35, p.y - p.h*0.35, p.w*0.7, p.h*0.7,
                     player.x - player.w*0.35, player.y - player.h*0.35, player.w*0.7, player.h*0.7)){
        hitPlayer(false);
        spawnDebris(p.x, p.y, '#3a3a3a');
        pirates.splice(i,1);
        continue;
      }
    }

    if(p.y - p.h > PLAY_TOP + PLAY_H){
      pirates.splice(i,1);
      score += 5;
    }
  }
}

function drawSkull(x, y, r){
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = '#f0f0f0';
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI*2);
  ctx.fill();
  ctx.fillRect(-r*0.5, r*0.5, r, r*0.4);
  ctx.fillStyle = '#101010';
  ctx.beginPath();
  ctx.arc(-r*0.4, -r*0.15, r*0.28, 0, Math.PI*2);
  ctx.arc( r*0.4, -r*0.15, r*0.28, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(0, r*0.05);
  ctx.lineTo(-r*0.15, r*0.4);
  ctx.lineTo(r*0.15, r*0.4);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#f0f0f0';
  ctx.lineWidth = Math.max(2, r*0.22);
  ctx.beginPath();
  ctx.moveTo(-r*1.2, r*1.2); ctx.lineTo(r*1.2, r*1.9);
  ctx.moveTo(r*1.2, r*1.2);  ctx.lineTo(-r*1.2, r*1.9);
  ctx.stroke();
  ctx.restore();
}

function drawPirate(p){
  let alpha = 1;
  if(level.ghost && !p.visible){
    const untilFlip = 90 - p.ghostTimer;
    if(untilFlip <= 30){
      alpha = (Math.floor(frame/4)%2===0) ? 0.25 : 0.05;
    } else {
      alpha = 0.0;
    }
  }
  if(alpha <= 0.001) return;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(p.x, p.y + Math.sin(p.bob)*2);

  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath();
  ctx.ellipse(0, 20, 18, 7, 0, 0, Math.PI*2);
  ctx.fill();

  // hull pointing down toward player
  ctx.fillStyle = '#2b2b30';
  ctx.beginPath();
  ctx.moveTo(0, 22);
  ctx.quadraticCurveTo(15, 4, 13, -14);
  ctx.lineTo(-13, -14);
  ctx.quadraticCurveTo(-15, 4, 0, 22);
  ctx.closePath();
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(0,0,0,0.4)';
  ctx.stroke();
  ctx.fillStyle = '#1c1c20';
  ctx.fillRect(-12, -12, 24, 4);

  ctx.strokeStyle = '#3a2a18';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, -12);
  ctx.lineTo(0, 12);
  ctx.stroke();

  // black sail
  ctx.fillStyle = 'rgba(20,20,24,0.95)';
  ctx.beginPath();
  ctx.moveTo(-1, 10);
  ctx.quadraticCurveTo(-13, 0, -1, -10);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = 'rgba(30,30,38,0.95)';
  ctx.beginPath();
  ctx.moveTo(1, 10);
  ctx.quadraticCurveTo(13, 0, 1, -10);
  ctx.closePath();
  ctx.fill();

  drawSkull(0, -1, 4.5);

  ctx.restore();
}

/* ============================================================
   SECTION 9: PROJECTILES (cannonballs)
   ============================================================ */
function fireCannon(p){
  if(!player) return;
  const baseAngle = Math.atan2(player.y - p.y, player.x - p.x);
  const n = level.shots;
  const spread = level.spread;
  const speed = level.fireSpeed * (0.85 + 0.3*timeScale/level.maxTimeScale);
  for(let i=0;i<n;i++){
    let a = baseAngle;
    if(n > 1){
      a = baseAngle - spread/2 + (spread * i/(n-1));
    }
    cannonballs.push({
      x: p.x,
      y: p.y + 12,
      vx: Math.cos(a)*speed,
      vy: Math.sin(a)*speed,
      r: level.ice ? 9 : 5,
      ice: level.ice,
      trail: []
    });
  }
}

function updateCannonballs(){
  for(let i = cannonballs.length - 1; i >= 0; i--){
    const c = cannonballs[i];
    c.trail.push({ x:c.x, y:c.y });
    if(c.trail.length > 6) c.trail.shift();
    c.x += c.vx;
    c.y += c.vy;

    if(player && invincible <= 0 && state === S.PLAYING){
      const hitR = (c.ice ? c.r + 4 : c.r) + 10;
      const dx = c.x - player.x, dy = c.y - player.y;
      if(dx*dx + dy*dy < hitR*hitR){
        hitPlayer(true);
        spawnDebris(c.x, c.y, c.ice ? '#bfe6ff' : '#202020');
        cannonballs.splice(i,1);
        continue;
      }
    }

    if(c.x < -20 || c.x > CANVAS_W + 20 || c.y < PLAY_TOP - 30 || c.y > CANVAS_H + 20){
      cannonballs.splice(i,1);
    }
  }
}

function drawCannonballs(){
  for(const c of cannonballs){
    for(let t=0;t<c.trail.length;t++){
      const tp = c.trail[t];
      const a = (t+1)/c.trail.length * 0.4;
      ctx.fillStyle = c.ice ? 'rgba(180,220,255,'+a+')' : 'rgba(120,120,120,'+a+')';
      ctx.beginPath();
      ctx.arc(tp.x, tp.y, c.r*0.7*(t+1)/c.trail.length + 1, 0, Math.PI*2);
      ctx.fill();
    }
    const grad = ctx.createRadialGradient(c.x-c.r*0.3, c.y-c.r*0.3, 1, c.x, c.y, c.r);
    if(c.ice){
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(1, '#5aa8e0');
    } else {
      grad.addColorStop(0, '#555');
      grad.addColorStop(1, '#0a0a0a');
    }
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r, 0, Math.PI*2);
    ctx.fill();
  }
}

/* ============================================================
   SECTION 10: COINS
   ============================================================ */
function spawnCoin(){
  const r = Math.random();
  let type;
  if(r < 0.60) type = 'bronze';
  else if(r < 0.88) type = 'silver';
  else type = 'gold';
  const t = COIN_TYPES[type];
  coins.push({
    x: 20 + Math.random()*(CANVAS_W - 40),
    y: PLAY_TOP + 20,
    type: type,
    r: t.r,
    value: t.value,
    spin: Math.random()*Math.PI*2,
    vy: 0.6 + Math.random()*0.4
  });
}

function updateCoins(){
  for(let i = coins.length - 1; i >= 0; i--){
    const c = coins[i];
    c.y += c.vy;
    c.spin += 0.08;
    if(player){
      const dx = c.x - player.x, dy = c.y - player.y;
      const cr = c.r + 16;
      if(dx*dx + dy*dy < cr*cr){
        save.coins += c.value;
        levelCoinsEarned += c.value;
        score += c.value * 5;
        Audio2.sfx('coin');
        spawnSparkle(c.x, c.y, COIN_TYPES[c.type].shine);
        coins.splice(i,1);
        continue;
      }
    }
    if(c.y - c.r > PLAY_TOP + PLAY_H){ coins.splice(i,1); }
  }
}

function drawCoin(c){
  const t = COIN_TYPES[c.type];
  const sx = Math.abs(Math.cos(c.spin));
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.scale(0.4 + 0.6*sx, 1);
  const grad = ctx.createRadialGradient(-c.r*0.3, -c.r*0.3, 1, 0, 0, c.r);
  grad.addColorStop(0, t.shine);
  grad.addColorStop(1, t.color);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(0, 0, c.r, 0, Math.PI*2);
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(0,0,0,0.25)';
  ctx.stroke();
  ctx.restore();
  if(Math.floor(c.spin*2)%4===0){
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath();
    ctx.arc(c.x - c.r*0.3, c.y - c.r*0.3, 1.5, 0, Math.PI*2);
    ctx.fill();
  }
}

/* ============================================================
   SECTION 11: PARTICLES
   ============================================================ */
function spawnDebris(x, y, color){
  for(let i=0;i<14;i++){
    const a = Math.random()*Math.PI*2;
    const sp = 1 + Math.random()*4;
    particles.push({
      x:x, y:y,
      vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 1,
      life: 30 + Math.random()*20, maxLife: 50,
      r: 2 + Math.random()*3,
      color: color || '#888',
      grav: 0.12
    });
  }
}
function spawnSparkle(x, y, color){
  for(let i=0;i<8;i++){
    const a = Math.random()*Math.PI*2;
    const sp = 0.5 + Math.random()*2.5;
    particles.push({
      x:x, y:y,
      vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
      life: 20 + Math.random()*15, maxLife: 35,
      r: 1.5 + Math.random()*2,
      color: color || '#fff',
      grav: 0.02
    });
  }
}
function updateParticles(){
  for(let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += p.grav;
    p.life--;
    if(p.life <= 0) particles.splice(i,1);
  }
}
function drawParticles(){
  for(const p of particles){
    ctx.globalAlpha = Math.max(0, p.life/p.maxLife);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ============================================================
   SECTION 12: LEVEL MANAGEMENT
   ============================================================ */
function beginLevel(index){
  curLevelIndex = index;
  level = LEVELS[index];
  levelFrames = 0;
  levelEnding = false;
  timeScale = 1.0;
  spawnTimer = 0;
  coinTimer = 0;
  score = 0;
  levelCoinsEarned = 0;
  pirates = [];
  cannonballs = [];
  coins = [];
  particles = [];
  player = makePlayer();
  lives = 3;
  invincible = 90; // grace at start
  usePointerSteer = false;
  pointerTarget.x = player.x;
  pointerTarget.y = player.y;
  state = S.TRANSITION;
}

function startLevelPlay(){
  state = S.PLAYING;
}

function updateLevelProgress(){
  levelFrames++;
  const prog = Math.min(1, levelFrames / level.duration);
  timeScale = 1.0 + (level.maxTimeScale - 1.0) * prog;

  if(!levelEnding && levelFrames >= level.duration){
    levelEnding = true;
  }

  if(!levelEnding){
    spawnTimer++;
    const effInterval = Math.max(18, level.spawnInterval / timeScale);
    if(spawnTimer >= effInterval){
      spawnTimer = 0;
      const cnt = Math.max(level.spawnCount,
                           Math.round(level.spawnCount * (0.6 + 0.7*(timeScale-1))));
      spawnPirates(cnt);
    }
    coinTimer++;
    if(coinTimer >= level.coinRate){
      coinTimer = 0;
      spawnCoin();
    }
  }

  if(!levelEnding) score += 1;

  if(levelEnding && pirates.length === 0 && cannonballs.length === 0){
    finishLevel();
  }
}

function finishLevel(){
  lastScore = score;
  lastCoins = levelCoinsEarned;
  completeLevel(curLevelIndex + 1);
  persist();
  Audio2.sfx('fanfare');
  if(curLevelIndex + 1 >= LEVELS.length){
    state = S.WIN;
  } else {
    state = S.LEVEL_COMPLETE;
  }
}

function advanceFromComplete(){
  const next = curLevelIndex + 1;
  if(next < LEVELS.length){
    beginLevel(next);
  } else {
    state = S.WIN;
  }
}

function hitPlayer(byProjectile){
  if(invincible > 0) return;
  lives--;
  Audio2.sfx(byProjectile ? 'hit' : 'crash');
  spawnDebris(player.x, player.y, '#cc4422');
  invincible = 100;
  if(lives <= 0){
    lastScore = score;
    lastCoins = levelCoinsEarned;
    persist();
    state = S.GAME_OVER;
  }
}

/* ============================================================
   SECTION 13: OCEAN RENDERER
   ============================================================ */
let menuOceanFrame = 0;

function drawOcean(oc1, oc2, wc, topY, height, t){
  const grad = ctx.createLinearGradient(0, topY, 0, topY + height);
  grad.addColorStop(0, oc1);
  grad.addColorStop(1, oc2);
  ctx.fillStyle = grad;
  ctx.fillRect(0, topY, CANVAS_W, height);

  ctx.save();
  ctx.beginPath();
  ctx.rect(0, topY, CANVAS_W, height);
  ctx.clip();

  const bands = 9;
  for(let b=0;b<bands;b++){
    const yBase = topY + ((b/bands)*height + (t*0.6) % (height/bands));
    ctx.fillStyle = wc;
    ctx.beginPath();
    ctx.moveTo(-10, yBase);
    const amp = 6 + b*0.6;
    for(let x=-10;x<=CANVAS_W+10;x+=24){
      const yy = yBase + Math.sin((x*0.03) + t*0.05 + b)*amp;
      ctx.lineTo(x, yy);
    }
    ctx.lineTo(CANVAS_W+10, yBase + 18);
    ctx.lineTo(-10, yBase + 18);
    ctx.closePath();
    ctx.fill();
  }

  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  for(let i=0;i<14;i++){
    const gx = (i*73 + (t*0.8)) % CANVAS_W;
    const gy = topY + ((i*113 + t*1.2) % height);
    ctx.fillRect(gx, gy, 10, 2);
  }
  ctx.restore();
}

/* ============================================================
   SECTION 14: HUD RENDERER
   ============================================================ */
function drawHeart(x, y, size, filled){
  ctx.save();
  ctx.translate(x, y);
  const s = size;
  ctx.beginPath();
  ctx.moveTo(0, s*0.3);
  ctx.bezierCurveTo(-s*0.5, -s*0.3, -s, s*0.25, 0, s);
  ctx.moveTo(0, s*0.3);
  ctx.bezierCurveTo(s*0.5, -s*0.3, s, s*0.25, 0, s);
  ctx.closePath();
  if(filled){
    ctx.fillStyle = '#e74c3c';
    ctx.fill();
  } else {
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
  ctx.restore();
}

function drawCoinIcon(x, y, r){
  const grad = ctx.createRadialGradient(x-r*0.3, y-r*0.3, 1, x, y, r);
  grad.addColorStop(0, '#fff7c0');
  grad.addColorStop(1, '#ffd700');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(120,90,0,0.5)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.fillStyle = 'rgba(120,90,0,0.6)';
  ctx.font = 'bold '+(r*1.1)+'px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('$', x, y+1);
}

function drawHUD(){
  ctx.fillStyle = 'rgba(8,16,26,0.92)';
  ctx.fillRect(0, 0, CANVAS_W, HUD_H);
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.fillRect(0, HUD_H-2, CANVAS_W, 2);

  ctx.fillStyle = '#dfe9f2';
  ctx.font = 'bold 16px "Trebuchet MS", sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText('Lvl '+(curLevelIndex+1)+': '+level.name, 10, 20);

  for(let i=0;i<3;i++){
    drawHeart(CANVAS_W/2 - 26 + i*26, 6, 11, i < lives);
  }

  ctx.fillStyle = '#dfe9f2';
  ctx.font = 'bold 16px "Trebuchet MS", sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText('Score '+score, CANVAS_W - 10, 20);

  // second row
  drawCoinIcon(16, 44, 8);
  ctx.fillStyle = '#ffe680';
  ctx.font = 'bold 14px "Trebuchet MS", sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(String(save.coins), 30, 45);

  const pbX = 96, pbY = 39, pbW = CANVAS_W - 96 - 96, pbH = 11;
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  roundRect(pbX, pbY, pbW, pbH, 5); ctx.fill();
  const prog = Math.min(1, levelFrames / level.duration);
  ctx.fillStyle = levelEnding ? '#2ecc71' : '#39b0e6';
  if(prog > 0){
    roundRect(pbX, pbY, Math.max(pbH, pbW*prog), pbH, 5); ctx.fill();
  }
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.font = '10px "Trebuchet MS", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(Math.floor(prog*100)+'%', pbX + pbW/2, pbY + pbH/2 + 1);

  const threat = Math.min(100, Math.round(((timeScale-1)/((level.maxTimeScale-1) || 1))*100));
  ctx.textAlign = 'right';
  ctx.font = 'bold 12px "Trebuchet MS", sans-serif';
  ctx.fillStyle = threat > 66 ? '#ff6b5e' : (threat > 33 ? '#ffcc55' : '#9fd6a0');
  ctx.fillText('THREAT '+threat+'%', CANVAS_W - 10, 45);
}

/* ============================================================
   SECTION 15: SCREEN RENDERERS
   ============================================================ */
function drawTitleBoat(cx, cy, scale){
  const skin = SKINS.find(s=>s.id === save.selectedSkin) || SKINS[0];
  drawBoat(cx, cy, scale, skin.hull, skin.sail, '#5a3a18', false, frame*0.1);
}

function centerText(txt, x, y, font, color, align){
  ctx.fillStyle = color;
  ctx.font = font;
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(txt, x, y);
}

function drawLock(cx, cy, s){
  ctx.save();
  ctx.translate(cx, cy);
  ctx.strokeStyle = 'rgba(230,230,230,0.85)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, 0, s*0.7, Math.PI, 0);
  ctx.stroke();
  ctx.fillStyle = 'rgba(230,230,230,0.85)';
  ctx.fillRect(-s, 0, s*2, s*1.4);
  ctx.fillStyle = 'rgba(40,40,40,0.9)';
  ctx.beginPath();
  ctx.arc(0, s*0.6, s*0.25, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

// --- LEVEL SELECT ---
function renderLevelSelect(){
  menuOceanFrame += 1;

  const tileW = 80, tileH = 76;

  for(let i=0;i<LEVELS.length;i++){
    const lvNum = i + 1;

    ctx.lineWidth = 2;

    ctx.textBaseline = 'middle';

    ctx.font = '9px "Trebuchet MS", sans-serif';
    ctx.fillStyle = unlocked ? 'rgba(255,255,255,0.85)' : 'rgba(255,255,255,0.35)';
    const nm = LEVELS[i].name;

      ctx.fillText(nm.length>13? nm.slice(0,12)+'..' : nm, x + tileW/2, y + 58);

    const x = startX + col*cellW;
    const y = startY + row*cellH;

    const selected = save.selectedSkin === sk.id;

    ctx.save();
    roundRect(x, y, tileW, tileH, 10);
    ctx.fillStyle = selected ? '#1f9c5a' : (owned ? '#2b5070' : '#3a4654');
    ctx.fill();
    ctx.lineWidth = (shopSelectedIdx===i) ? 3 : 2;
    ctx.strokeStyle = (shopSelectedIdx===i) ? '#ffe680' : 'rgba(255,255,255,0.18)';
    ctx.stroke();
    drawBoat(x + tileW/2, y + 32, 0.9, sk.hull, sk.sail, '#5a3a18', false, 0);
    ctx.fillStyle = '#fff';
    ctx.font = '9px "Trebuchet MS", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(sk.name.length>13? sk.name.slice(0,12)+'..':sk.name, x + tileW/2, y + 58);
    ctx.font = 'bold 11px "Trebuchet MS", sans-serif';
    if(selected){ ctx.fillStyle = '#ffe680'; ctx.fillText('EQUIPPED', x + tileW/2, y + 73); }
    else if(owned){ ctx.fillStyle = '#bfe0ff'; ctx.fillText('OWNED', x + tileW/2, y + 73); }
    else { ctx.fillStyle = '#ffe680'; ctx.fillText(sk.cost + ' c', x + tileW/2, y + 73); }
    ctx.restore();

    (function(idx){
      addButton(x, y, tileW, tileH, '', function(){ shopSelect(idx); }, { invisible:true });
    })(i);
  }

  const owned = save.ownedSkins.indexOf(sel.id) >= 0;
  const isSel = save.selectedSkin === sel.id;
  const aw = 200, ah = 44, ax = (CANVAS_W-aw)/2, ay = startY + 2*cellH + 6;
  let actionBtn;
  if(isSel){
    actionBtn = addButton(ax, ay, aw, ah, 'EQUIPPED', function(){}, { fill:'#2f7d52', enabled:false });
  } else if(owned){
    actionBtn = addButton(ax, ay, aw, ah, 'EQUIP', function(){ equipSkin(sel.id); }, { fill:'#1f9c5a' });
  } else {
    const canAfford = save.coins >= sel.cost;
    actionBtn = addButton(ax, ay, aw, ah, 'BUY  ('+sel.cost+' c)', function(){ buySkin(sel.id); },
      { fill: canAfford ? '#1f78c4' : '#3a4654', enabled: canAfford });
  }
  const backW = 160, backH = 42;
  const backBtn = addButton((CANVAS_W-backW)/2, ay + 54, backW, backH, 'BACK', gotoMenu, { fill:'#445566' });

  drawSingleButton(actionBtn);
  drawSingleButton(backBtn);
}

function shopSelect(idx){ shopSelectedIdx = idx; }
function buySkin(id){
  const sk = SKINS.find(s=>s.id===id);
  if(!sk) return;
  if(save.ownedSkins.indexOf(id) >= 0) return;
  if(save.coins >= sk.cost){
    save.coins -= sk.cost;
    save.ownedSkins.push(id);
    save.selectedSkin = id;
    persist();
    Audio2.sfx('coin');
  }
}
function equipSkin(id){
  if(save.ownedSkins.indexOf(id) >= 0){
    save.selectedSkin = id;
    persist();
  }
}

/* ============================================================
   SECTION 16: GAME LOOP (update + render)
   ============================================================ */
function update(){
  frame++;
  if(state === S.PLAYING){
    if(invincible > 0) invincible--;
    updatePlayer();
    updatePirates();
    updateCannonballs();
    updateCoins();
    updateParticles();
    updateLevelProgress();
  } else {
    updateParticles();
  }
}

function renderPlaying(){
  drawOcean(level.oc1, level.oc2, level.wc, PLAY_TOP, PLAY_H, levelFrames);

  for(const c of coins) drawCoin(c);
  for(const p of pirates) drawPirate(p);
  drawCannonballs();
  drawPlayer();
  drawParticles();

  if(level.fog){
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, PLAY_TOP, CANVAS_W, PLAY_H);
    ctx.clip();
    const fg = ctx.createRadialGradient(player.x, player.y, 40, player.x, player.y, 220);
    fg.addColorStop(0, 'rgba(10,15,25,0)');
    fg.addColorStop(1, 'rgba(8,12,20,'+level.fog+')');
    ctx.fillStyle = fg;
    ctx.fillRect(0, PLAY_TOP, CANVAS_W, PLAY_H);
    ctx.fillStyle = 'rgba(120,140,160,'+(level.fog*0.25)+')';
    ctx.fillRect(0, PLAY_TOP, CANVAS_W, PLAY_H);
    ctx.restore();
  }

  if(level.wind){
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = 'rgba(200,220,255,0.6)';
    ctx.lineWidth = 2;
    for(let i=0;i<5;i++){
      const wy = PLAY_TOP + 40 + ((frame*3 + i*120) % PLAY_H);
      const wx = (frame*4 + i*90) % (CANVAS_W+60) - 30;
      ctx.beginPath();
      ctx.moveTo(wx, wy);
      ctx.lineTo(wx+24, wy);
      ctx.stroke();
    }
    ctx.restore();
  }

  drawHUD();

  if(invincible > 80){
    centerText('GET READY', CANVAS_W/2, PLAY_TOP + PLAY_H/2,
      'bold 34px "Trebuchet MS", sans-serif', 'rgba(255,255,255,0.85)');
  }
}

function render(){
  ctx.clearRect(0,0,CANVAS_W,CANVAS_H);
  switch(state){
    case S.MENU:           renderMenu(); break;
    case S.LEVEL_SELECT:   renderLevelSelect(); break;
    case S.SHOP:           renderShop(); break;
    case S.SETTINGS:       renderSettings(); break;
    case S.TRANSITION:     renderTransition(); break;
    case S.PLAYING:        renderPlaying(); break;
    case S.LEVEL_COMPLETE: renderLevelComplete(); break;
    case S.GAME_OVER:      renderGameOver(); break;
    case S.WIN:            renderWin(); break;
  }
}

function loop(){
  update();
  render();
  requestAnimationFrame(loop);
}

/* ============================================================
   SECTION 17: CLICK HANDLER + NAV
   ============================================================ */
function handleClick(x, y){
  buttonsClick(x, y);
}

function gotoMenu(){ state = S.MENU; }
function gotoLevelSelect(){ state = S.LEVEL_SELECT; }
function gotoShop(){
  const idx = SKINS.findIndex(s=>s.id===save.selectedSkin);
  shopSelectedIdx = idx >= 0 ? idx : 0;
  state = S.SHOP;
}
function gotoSettings(){ state = S.SETTINGS; }

/* ============================================================
   SECTION 18: UTILITIES + INIT
   ============================================================ */
function rectOverlap(ax, ay, aw, ah, bx, by, bw, bh){
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

function init(){
  loadSave();
  level = LEVELS[0];
  curLevelIndex = 0;
  state = S.MENU;
  requestAnimationFrame(loop);
}

init();
</script>
